[project]
name = "captr"
version = "0.1.0"
description = "CAPTR: Caption-based Context Pruning for Tabular Reasoning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "transformers",
    "torch",
    "torchaudio",
    "torchvision",
    "datasets",
    "evaluate",
    "scikit-learn",
    "pandas",
    "vllm==0.11.2",
    "accelerate",
    "xformers",
    "triton",
    "nltk>=3.9.2",
    "recognizers-text>=1.0.2a2",
    "recognizers-text-choice>=1.0.2a2",
    "recognizers-text-suite>=1.0.2a2",
    "emoji==1.7.0",
    "fuzzywuzzy>=0.18.0",
    "backoff>=2.2.1",
    "qwen-omni-utils>=0.0.8",
    "qwen-vl-utils>=0.0.14",
    "rapidfuzz>=3.14.1",
    "absl-py>=2.3.1",
    "babel>=2.17.0",
    "pathlib>=1.0.1",
    "pure-eval>=0.2.3",
    "python-levenshtein>=0.27.1",
    "records>=0.6.0",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.5.1",
    "arrow>=1.3.0",
    "sqlalchemy>=2.0.43",
    "sqlparse>=0.5.3",
    "stack-data>=0.6.3",
    "tablib>=3.8.0",
    "tabulate>=0.9.0",
    "tenacity>=9.1.2",
    "tensorboard>=2.20.0",
    "tensorboard-data-server>=0.7.2",
    "termcolor>=3.1.0",
    "terminado>=0.18.1",
    "tf-slim>=1.1.0",
    "matplotlib>=3.10.7",
    "ruff>=0.13.3",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pylint",
    "mypy",
    "ipykernel", # For running in Jupyter notebooks
    "line-profiler",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
# Since I am building upon H-STAR, I don't want to fix their code violations: Ignore C408, F841, C401, C414, C416, C419
ignore = ["C901", "E501", "E741", "F402", "F823", "E203", "E501", "E731", "E741", "E722"]
select = ["C", "E", "F", "I", "W"]
# Disable the automatic fix (removal) for unused imports (F401) because I want to keep imports when commenting out code for debugging
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["transformers"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "--doctest-glob='**/*.md'"
doctest_optionflags="NUMBER NORMALIZE_WHITESPACE ELLIPSIS"
markers = [
    "flash_attn_test: marks tests related to flash attention (deselect with '-m \"not flash_attn_test\"')",
    "bitsandbytes: select (or deselect with `not`) bitsandbytes integration tests",
    "generate: marks tests that use the GenerationTesterMixin"
]
log_cli = 1
log_cli_level = "WARNING"


[tool.flake8]
max-line-length = 119

[tool.uv.sources]
bleurt = { git = "https://github.com/google-research/bleurt.git", rev = "cebe7e6f996b40910cfaa520a63db47807e3bf5c" }

[tool.uv]
package = true

[tool.setuptools]
packages = ["baselines", "datasets", "generation", "mmtabqa", "nsql", "scripts", "utils"]
